[tool.poetry]
name = "geosushi"
version = "0.2.0"
description = "Day-to-day tools for metocean models (WW3, SWAN, ROMS, WRF): pre/post-processing, data plots and analyses"
authors = ["jtcarvalho <jtcarvalho@gmail.com>"]
readme = "README.md"
packages = [{ include = "geosushi", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.2.3"
scipy = "^1.15.2"
matplotlib = "^3.10.0"
xarray = "^2025.1.2"
pandas = "^2.2.3"
cartopy = "^0.24.1"
simplejson = "^3.20.1"
pyyaml = "^6.0.2"
glob2 = "^0.7"
natsort = "^8.4.0"
netcdf4 = "^1.7.2"
h5netcdf = "^1.5.0"


[tool.poetry.scripts]
geosushi = "geosushi.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
ipykernel = "^7.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
